<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Mz4 agency — página não encontrada</title>
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{--bg:#050506;--card:#101014;--red:#fb1404;--red-hi:#ff5a3c;--red-dk:#8f0b01;--ink:#f5f1ea;--sub:#d8d2c4;--mut:#a09a90;--line:#232329}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 28px #00000030}
.card img{width:100%;max-width:240px;border-radius:16px;box-shadow:0 0 30px #fb140438}
h1{font-size:20px;margin:14px 0 6px}p{color:var(--sub)}
.btn{display:inline-block;background:linear-gradient(180deg,var(--red-hi),var(--red) 45%,var(--red-dk));color:#fff;border:0;border-radius:16px;padding:13px 22px;font-weight:800;margin-top:10px;text-decoration:none;box-shadow:0 6px 24px #fb140438,inset 0 1px 0 #ffffff55}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" alt="Mz4 agency">
<h1>Essa página não existe 😅</h1>
<p>O link pode ter mudado. Volte pro painel e continue o jogo.</p>
<a class="btn" href="index.html">Voltar pro app</a>
</div>
</body>
</html>
